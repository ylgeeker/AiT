name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Merge gate
        run: make fmt && make vet && make test && make build && make test-cross && make check-generate

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: merge-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: E2E against in-repo testenv-mock
        # Full CLI suite (smoke + @ssh login/meta/get/put) against loopback mock sshd.
        # tmux / zmodem / destructive stay excluded; nested/AI keys skip when unconfigured.
        env:
          CI: "true"
          AIT_TEST_USE_MOCK: "1"
        run: make test-e2e-mock

  dupl-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Duplicate code scan (advisory)
        run: make dupl
