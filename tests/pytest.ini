[pytest]
testpaths = e2e
pythonpath = ..
timeout = 120
addopts = -ra --strict-markers
markers =
    smoke: quick smoke (help and non-interactive CLI)
    mock: in-repo testenv-mock (loopback SSH/HTTP; no real hosts)
    ssh: requires SSH (config.local.yaml locally, or in-repo testenv-mock when AIT_TEST_USE_MOCK=1)
    ai: requires API key or local Ollama
    tmux: requires remote tmux
    zmodem: requires lrzsz and nested SSH
    destructive: deletes sessions or overwrites persisted state
